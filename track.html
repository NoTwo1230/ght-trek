<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="tk.title">实时轨迹</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="track.css" />
<script src="lang.js"></script>
</head>
<body>

<header class="tk-topbar">
  <div class="tk-brand">
    <div class="tk-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 19l5-7 4 5 3-4 6 6"/><circle cx="17" cy="6" r="2"/>
      </svg>
    </div>
    <div>
      <div class="tk-title" data-i18n="tk.title">实时轨迹</div>
      <div class="tk-sub">Great Himalaya Trail · GPX track sync</div>
    </div>
  </div>
  <div class="tk-spacer"></div>
  <span class="tk-status" id="tkStatus"><span class="tk-dot"></span><span id="tkStatusText" data-i18n="tk.waiting">等待定位数据</span></span>
  <a class="tk-back" href="index.html" data-i18n-title="tk.back" title="返回首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> <span data-i18n="tk.back">返回首页</span></a>
  <button class="tk-lang-btn" type="button">Language ▾</button>
</header>

<div class="tk-shell">
  <aside class="tk-panel">

    <div class="tk-section">
      <div class="tk-section-h"><span data-i18n="tk.traveler">行者信息</span></div>
      <div class="tk-kv"><span data-i18n="tk.project">项目</span><b data-i18n="tk.project.val">GHT 大喜马拉雅高线</b></div>
      <div class="tk-kv"><span data-i18n="tk.device">记录设备</span><b data-i18n="tk.device.val">手表 / 手机 GPX</b></div>
      <div class="tk-kv"><span data-i18n="tk.location">当前位置</span><b id="tkRegion">—</b></div>
      <div class="tk-kv"><span data-i18n="tk.weather">天气</span><b data-i18n="tk.weather.val">山区无实时气象站</b></div>
      <div class="tk-kv"><span data-i18n="tk.points">轨迹点数</span><b id="tkBattery">—</b></div>
    </div>

    <div class="tk-section">
      <div class="tk-section-h"><span data-i18n="tk.sync">GPX 轨迹同步</span></div>
      <div class="tk-live-banner" id="tkBanner"><span class="tk-dot"></span><span id="tkBannerText" data-i18n="tk.waiting">等待定位数据</span></div>
      <div class="tk-telem">
        <div class="tk-cell"><label data-i18n="tk.lat">当前纬度 (LAT)</label><strong id="tkLat">—</strong></div>
        <div class="tk-cell"><label data-i18n="tk.lon">当前经度 (LON)</label><strong id="tkLon">—</strong></div>
        <div class="tk-cell"><label data-i18n="tk.alt">当前海拔 (ALT)</label><strong id="tkAlt">—</strong></div>
        <div class="tk-cell"><label data-i18n="tk.spd">即时速度 (SPD)</label><strong id="tkSpd">—</strong></div>
        <div class="tk-cell wide"><label data-i18n="tk.distance">累计徒步里程</label><strong id="tkDistance">—</strong></div>
        <div class="tk-cell wide"><label data-i18n="tk.lastts">最后同步点（尼泊尔时间）</label><strong id="tkLastTs">—</strong></div>
      </div>
      <div class="tk-btns tk-primary-btns">
        <button class="tk-btn primary" id="tkLocate" type="button" data-i18n="tk.locate">定位行者坐标</button>
        <button class="tk-btn primary" id="tkFit" type="button" data-i18n="tk.fit">全览路线</button>
      </div>
    </div>

    <div class="tk-section">
      <div class="tk-section-h"><span data-i18n="tk.reports">同步记录</span></div>
      <div class="tk-timeline" id="tkTimeline"></div>
    </div>

  </aside>

  <main class="tk-map-wrap">
    <button class="tk-panel-toggle" id="tkPanelToggle" type="button">☰ <span data-i18n="tk.traveler">行者信息</span></button>
    <div id="map"></div>
    <div class="tk-map-title"><span data-i18n="tk.fullroute">GHT 全线 · 最后同步位置</span><small id="tkMapSub" data-i18n="tk.sub.terrain">底图：Esri World Topo · 与总览页一致</small></div>
    <div class="tk-basemap">
      <button type="button" id="tkBaseTerrain" class="on" data-i18n="tk.base.terrain">地形</button>
      <button type="button" id="tkBaseTopo" data-i18n="tk.base.topo">等高线</button>
      <button type="button" id="tkBaseSatellite" data-i18n="tk.base.satellite">卫星</button>
    </div>
    <div class="tk-compass" title="N">N</div>
    <div class="tk-legend">
      <div class="tk-lg-row"><span class="tk-lg-sw tk-lg-plan"></span><span data-i18n="tk.legend.plan">计划路线 · 目标</span></div>
      <div class="tk-lg-row"><span class="tk-lg-sw tk-lg-actual"></span><span data-i18n="tk.legend.actual">实际徒步轨迹</span></div>
      <div class="tk-lg-row"><span class="tk-lg-sw tk-lg-live"></span><span data-i18n="tk.legend.live">GPX 同步轨迹（最后一段）</span></div>
    </div>
  </main>
</div>

<script src="demo-seed.js"></script>
<script src="gpx-live.js"></script>
<script src="ght-region-map.js"></script>
<script src="track-demo.js"></script>
</body>
</html>
