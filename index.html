<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 后端地址：EdgeOne 边缘函数与静态站同域运行，留空则自动使用当前域名（location.origin） -->
<meta name="ght-api" content="">
<title>GHT 大喜马拉雅高线徒步追踪</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<script src="nepal-provinces.js"></script>
  <script src="sections-data.js"></script>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="design-redesign.css" />
<link rel="stylesheet" href="demo-live.css" />
<script>document.documentElement.dataset.theme='light';</script>
</head>

<body>

<div class="app">

  <!-- ── TOP HEADER（仿 demo topbar）── -->
  <header class="site-header" id="siteHeader">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 19l5-7 4 5 3-4 6 6"/><circle cx="17" cy="6" r="2"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>GHT 大喜马拉雅高线徒步追踪</h1>
        <p>Great Himalaya Trail · 远征追踪面板</p>
      </div>
    </div>
    <div class="header-right">
      <span class="live" id="hdrLive"><span class="dot"></span>定位中</span>
      <button class="lang-btn" type="button">Language ▾</button>
      <nav class="hdr-nav" aria-label="页面导航">
        <a class="hn-link" id="navTrack" href="track.html" target="_blank" rel="noopener">实时轨迹</a>
        <a class="hn-link" id="navItinerary" href="itinerary.html" target="_blank" rel="noopener">行程对比</a>
        <a class="hn-link" id="navSections" href="sections.html" target="_blank" rel="noopener">路段进度</a>
        <a class="hn-link" id="navJournal" href="journal.html" target="_blank" rel="noopener">远征日志</a>
      </nav>
    </div>
  </header>

  <!-- ── DASH GRID ── -->
  <div class="dash-grid">

    <!-- ① 进度总览模块已并入「整体进度」卡片（圆环 + 4 KPI），见 cardStatus -->

    <!-- 首页布局：左侧「整体进度 / 今日摘要」上下排列，右侧「垭口清单」；地图已移到导航「实时轨迹」页 -->
    <div class="main-duo">
      <div class="two-col">
        <section class="card" id="cardStatus"></section>
        <section class="card" id="cardToday"></section>
      </div>
      <section class="card" id="cardPasses"></section>
    </div>

    <!-- 海拔剖面（独立全宽行） -->
    <main class="col-center">
      <div class="elevation-panel" id="elevationPanel">
        <div class="elevation-header">
          <div class="ev-h-left">
            <span class="ev-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M3 17l5-6 4 4 3-5 6 7"/><path d="M3 21h18"/></svg></span>
            <span class="ev-title">海拔剖面</span>
            <span class="ev-sub" id="elevScopeName">预设轨迹</span>
          </div>
          <div class="ev-h-right">
            <div class="ev-stats" id="elevStats"></div>
            <span class="elev-scope" id="elevScope">
              <button type="button" data-scope="full" class="on" onclick="setElevScope('full')">全程</button>
              <button type="button" data-scope="region" onclick="setElevScope('region')">当前区域</button>
            </span>
          </div>
        </div>
        <div class="elevation-placebar" id="elevPlacebar"></div>
        <div class="elevation-body" id="elevationBody"></div>
      </div>
    </main>

  </div>

  <!-- ── BOTTOM STATUS BAR ── -->
  <footer class="statusbar">
    <span>© 2026 GHT 高线追踪</span>
    <span class="live-dot" id="liveDot"><span class="ld-dot"></span> 等待定位数据</span>
    <span class="spacer"></span>
    <span>数据来源: GPX + GPX 同步轨迹（演示）</span>
    <span>底图: © OpenStreetMap · Esri · OpenTopoMap</span>
  </footer>

</div>

<!-- 首页已移除可见地图；保留离屏容器供地图与定位状态栏脚本正常初始化，视觉上不显示 -->
<div id="mapOffscreen" aria-hidden="true" style="position:absolute;left:-10000px;top:0;width:600px;height:400px;visibility:hidden;pointer-events:none;">
  <div id="map" style="width:100%;height:100%;"></div>
  <div id="currentPosBadge" class="pos-badge"><span class="prov-name">--</span><span class="prov-elev"></span></div>
  <div id="regionInfo" hidden></div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-card">
    <div class="spinner"></div>
    <div style="font-size:13px;">正在解析 GPX 轨迹...</div>
  </div>
</div>

<script src="demo-seed.js"></script>
<script src="demo-seed-init.js"></script>
<script src="ght-region-map.js"></script>
<script src="lang.js"></script>
<script src="app-data.js"></script>
<script src="app-map.js"></script>
<script src="app-render.js"></script>
<script src="app-gpx.js"></script>
<script src="app-upload.js"></script>
<script src="app-storage.js"></script>
<script src="app-init.js"></script>
<script src="gpx-live.js"></script>
<script src="demo-live.js"></script>

<!-- 主题切换已移除：全站仅保留 Stripe 浅色 -->
</body>
</html>
