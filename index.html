<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 后端地址：EdgeOne 边缘函数与静态站同域运行，留空则自动使用当前域名（location.origin） -->
<meta name="ght-api" content="">
<title>GHT 大喜马拉雅高线徒步追踪</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="nepal-provinces.js"></script>
  <script src="sections-data.js"></script>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="design-redesign.css" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ght-theme')!=='dark'?'light':'';}catch(e){}</script>
</head>

<body>

<div class="app">

  <!-- ── TOP HEADER（仿 demo topbar）── -->
  <header class="site-header" id="siteHeader">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 19l5-7 4 5 3-4 6 6"/><circle cx="17" cy="6" r="2"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>GHT 大喜马拉雅高线徒步追踪</h1>
        <p>Great Himalaya Trail · 远征追踪面板</p>
      </div>
    </div>
    <div class="header-right">
      <span class="live" id="hdrLive"><span class="dot"></span>实时追踪中</span>
      <button class="lang-btn" type="button">Language ▾</button>
      <nav class="hdr-nav" aria-label="页面导航">
        <a class="hn-link" id="navItinerary" href="itinerary.html?v=3" target="_blank" rel="noopener">行程</a>
        <a class="hn-link" id="navSections" href="sections.html?v=2" target="_blank" rel="noopener">路段</a>
        <a class="hn-link" id="navJournal" href="journal.html?v=2" target="_blank" rel="noopener">日志</a>
      </nav>
    </div>
  </header>

  <!-- ── DASH GRID ── -->
  <div class="dash-grid">

    <!-- ① 进度总览模块已并入「整体进度」卡片（圆环 + 4 KPI），见 cardStatus -->

    <!-- ② 当前状态（整体进度） + ③ 今日摘要 双栏 -->
    <div class="two-col">
      <section class="card" id="cardStatus"></section>
      <section class="card" id="cardToday"></section>
    </div>

    <!-- CENTER -->
    <main class="col-center">
      <section class="card map-card">
      <div class="card-h"><span class="ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2z"/><path d="M9 3v16M15 5v16"/></svg></span><span>交互地图</span><span class="en">MAP</span></div>
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-overlay pos-badge" id="currentPosBadge">
          <span class="pb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M12 21s-7-6.3-7-11a7 7 0 0114 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span> 当前位置: <span class="prov-name">--</span><span class="prov-elev"></span>
        </div>
        <div class="map-overlay map-compass" title="正北方向 N">
          <svg viewBox="0 0 40 40" width="22" height="22" aria-hidden="true">
            <circle cx="20" cy="20" r="18.5" fill="rgba(13,18,25,0.0)" stroke="rgba(230,237,243,0.30)" stroke-width="1.5"/>
            <polygon points="20,5 23.5,20 20,16.5 16.5,20" fill="#f85149"/>
            <polygon points="20,35 16.5,20 20,23.5 23.5,20" fill="#8b949e"/>
            <text x="20" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">N</text>
          </svg>
        </div>
        <div class="map-overlay map-legend" aria-label="图例">
          <div class="lg-row"><span class="lg-sw lg-cyan"></span>实际徒步轨迹</div>
          <div class="lg-row"><span class="lg-sw lg-plan"></span>计划路线 · 目标</div>
        </div>
        <div class="map-overlay region-info" id="regionInfo" hidden></div>
      </div>
      </section>
      <div class="elevation-panel" id="elevationPanel">
        <div class="elevation-header">
          <div class="ev-h-left">
            <span class="ev-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M3 17l5-6 4 4 3-5 6 7"/><path d="M3 21h18"/></svg></span>
            <span class="ev-title">海拔剖面</span>
            <span class="ev-sub" id="elevScopeName">预设轨迹</span>
          </div>
          <div class="ev-h-right">
            <div class="ev-stats" id="elevStats"></div>
            <span class="elev-scope" id="elevScope">
              <button type="button" data-scope="full" class="on" onclick="setElevScope('full')">全程</button>
              <button type="button" data-scope="region" onclick="setElevScope('region')">当前区域</button>
            </span>
          </div>
        </div>
        <div class="elevation-placebar" id="elevPlacebar"></div>
        <div class="elevation-body" id="elevationBody"></div>
      </div>
    </main>

    <!-- RIGHT COLUMN -->
    <aside class="col-right">
      <section class="card" id="cardPasses"></section>
    </aside>

  </div>

  <!-- ── BOTTOM STATUS BAR ── -->
  <footer class="statusbar">
    <span>© 2026 GHT 高线追踪</span>
    <span class="live-dot" id="liveDot"><span class="ld-dot"></span> Live Tracking Active · 实时追踪中</span>
    <span class="spacer"></span>
    <span>数据来源: GPX</span>
    <span>底图: © OpenStreetMap · Esri · OpenTopoMap</span>
  </footer>

</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-card">
    <div class="spinner"></div>
    <div style="font-size:13px;">正在解析 GPX 轨迹...</div>
  </div>
</div>

<script src="ght-region-map.js?v=3"></script>
<script src="app.js?v=13"></script>

<script src="theme-toggle.js"></script>
</body>
</html>
