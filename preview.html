<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GHT · 大喜马拉雅高线</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* ============ Tokens ============ */
  :root{
    --r-xl:18px; --r-lg:14px; --r-sm:9px;
    --display:"Fraunces","Songti SC",Georgia,"Times New Roman",serif;
    --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#0A0C0E; --bg2:#0D1013; --surface:#12161B; --surface-2:#161B21;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
    --text:#ECEAE3; --muted:#8A877E; --faint:#5C5A53;
    --accent:#E0A23C; --accent-soft:rgba(224,162,60,.12); --accent-line:rgba(224,162,60,.4);
    --route:rgba(236,234,227,.42); --route-done:#E0A23C;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 20px 50px -20px rgba(0,0,0,.7);
    --tile-filter:grayscale(.72) brightness(.58) contrast(1.18);
    --contour:rgba(255,255,255,.035);
  }
  html[data-theme="light"]{
    --bg:#F3F1EA; --bg2:#EFEDE5; --surface:#FFFFFF; --surface-2:#FAF8F2;
    --border:rgba(20,18,12,.09); --border-strong:rgba(20,18,12,.16);
    --text:#1B1A16; --muted:#6C6A60; --faint:#A09E94;
    --accent:#B97E22; --accent-soft:rgba(185,126,34,.12); --accent-line:rgba(185,126,34,.4);
    --route:rgba(27,26,22,.32); --route-done:#B97E22;
    --shadow:0 1px 0 rgba(255,255,255,.6),0 18px 44px -22px rgba(60,50,20,.25);
    --tile-filter:grayscale(.28) brightness(1.04) contrast(.96);
    --contour:rgba(20,18,12,.04);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--ui); color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background .5s var(--ease),color .5s var(--ease);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800'><g fill='none' stroke='%23000' stroke-opacity='0.05'><path d='M-50 620 C200 540 400 700 700 560 S1100 480 1260 560'/><path d='M-50 680 C200 600 400 760 700 620 S1100 540 1260 620'/><path d='M-50 560 C200 480 400 640 700 500 S1100 420 1260 500'/><circle cx='930' cy='250' r='150'/><circle cx='930' cy='250' r='100'/><circle cx='930' cy='250' r='55'/></g></svg>");
    background-size:cover; background-attachment:fixed;
  }

  /* ============ Top bar ============ */
  .bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:22px;
    padding:14px 30px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(10px);}
  .mark{display:flex;align-items:center;gap:12px}
  .mark .glyph{width:30px;height:30px;flex:none}
  .mark .name{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.2px;line-height:1}
  .mark .name b{font-weight:600}
  .mark .desc{font-size:11.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
  .nav{display:flex;gap:2px;margin-left:14px}
  .nav a{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;padding:8px 13px;border-radius:var(--r-sm);transition:.2s var(--ease)}
  .nav a:hover{color:var(--text);background:var(--surface-2)}
  .nav a.on{color:var(--text);background:var(--surface-2)}
  .spacer{flex:1}
  .ghost{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:600 13px/1 var(--ui);color:var(--text);
    padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--border);transition:.2s var(--ease)}
  .ghost:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}

  /* ============ Layout ============ */
  .wrap{max-width:1200px;margin:0 auto;padding:40px 30px 80px}
  .grid{display:grid;grid-template-columns:380px 1fr;gap:26px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}.nav{display:none}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
    box-shadow:var(--shadow);padding:24px;transition:border-color .3s var(--ease),transform .3s var(--ease)}
  .card:hover{border-color:var(--border-strong)}

  /* masthead */
  .mast .eyebrow{margin-bottom:14px}
  .mast h1{font-family:var(--display);font-weight:500;font-size:38px;line-height:1.05;margin:0 0 12px;letter-spacing:-.01em}
  .mast .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0;max-width:32ch}
  .rule{height:1px;background:var(--border);margin:22px 0}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
  .meta .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .meta .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .meta .v .st{color:var(--accent)}

  /* trail rail */
  .rail{margin-top:24px}
  .rail .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .rail .top .d{font-family:var(--display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
  .rail .top .d b{color:var(--accent)}
  .rail .top .t{font-size:11.5px;color:var(--muted)}
  .track{position:relative;height:6px;border-radius:99px;background:var(--surface-2);overflow:visible}
  .track .done{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#fff 0%),var(--accent));width:0;transition:width 1.2s var(--ease)}
  .track .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--accent);
    border:3px solid var(--bg);transform:translate(-50%,-50%);left:0;transition:left 1.2s var(--ease);box-shadow:0 0 0 4px var(--accent-soft)}
  .ticks{position:relative;height:14px;margin-top:6px}
  .ticks i{position:absolute;top:0;width:1px;height:6px;background:var(--border-strong);transform:translateX(-50%)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  @media(max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{padding:4px 20px;border-left:1px solid var(--border)}
  .kpi:first-child{border-left:none;padding-left:4px}
  .kpi .v{font-family:var(--display);font-weight:500;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .v.acc{color:var(--accent)}
  .kpi .k{margin-top:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  /* map */
  #map{height:480px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);background:var(--bg2)}
  .leaflet-container{background:var(--bg2);font-family:var(--ui)}
  .leaflet-tile{filter:var(--tile-filter)}
  .leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)!important}
  .legend{display:flex;gap:20px;margin-top:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .legend i{width:20px;height:3px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:7px}

  /* chart */
  .chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:8px;font-variant-numeric:tabular-nums}

  /* sections */
  .sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .sec-h .num{font-family:var(--display);font-size:13px;color:var(--faint)}
  .list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
  .row{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:var(--r-sm);transition:.18s var(--ease)}
  .row:hover{background:var(--surface-2)}
  .row .idx{font-family:var(--display);font-size:15px;color:var(--faint);width:26px;flex:none;font-variant-numeric:tabular-nums}
  .row .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--accent-line)}
  .row .nm{font-size:14px;font-weight:500}
  .row .en{font-size:11.5px;color:var(--muted);margin-top:2px}

  .foot{margin-top:46px;text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.04em}

  /* reveal */
  .rv{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
  .rv.in{opacity:1;transform:none}
</style>
</head>
<body>
  <header class="bar">
    <div class="mark">
      <svg class="glyph" viewBox="0 0 32 32" fill="none">
        <path d="M3 25 L12 9 L17 18 L21 12 L29 25 Z" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3 25 L29 25" stroke="var(--border-strong)" stroke-width="1.2"/>
      </svg>
      <div>
        <div class="name"><b>GHT</b></div>
        <div class="desc">Great Himalaya Trail</div>
      </div>
    </div>
    <nav class="nav">
      <a class="on" href="#">总览</a><a href="#">行程</a><a href="#">路段</a><a href="#">日志</a><a href="#">管理</a>
    </nav>
    <div class="spacer"></div>
    <div class="ghost" id="themeBtn">◐ <span id="themeTxt">浅色</span></div>
  </header>

  <div class="wrap">
    <div class="grid">
      <!-- 左列 -->
      <div>
        <section class="card mast rv">
          <div class="eyebrow">2026 Expedition · 概念预览</div>
          <h1>大喜马拉雅<br/>高线</h1>
          <p class="sub">自西向东横贯尼泊尔全境，1,602 公里、88 天的高海拔纵走路线。</p>
          <div class="rule"></div>
          <div class="meta">
            <div><div class="k">出发</div><div class="v" id="startLbl">—</div></div>
            <div><div class="k">状态</div><div class="v"><span class="st">追踪中</span></div></div>
            <div><div class="k">已记录轨迹</div><div class="v" id="kAct">0</div></div>
            <div><div class="k">路段</div><div class="v" id="kSec">0</div></div>
          </div>
          <div class="rail">
            <div class="top">
              <div class="d">第 <b id="doneDays">0</b> / <span id="totalDays">0</span> 天</div>
              <div class="t" id="pctTxt">0% 完成</div>
            </div>
            <div class="track"><div class="done" id="railDone"></div><div class="knob" id="railKnob"></div></div>
            <div class="ticks" id="ticks"></div>
          </div>
        </div>

        <section class="card rv" style="margin-top:26px">
          <div class="sec-h"><div class="eyebrow">路段索引</div><div class="num" id="secCount"></div></div>
          <div class="list" id="list"></div>
        </section>
      </div>

      <!-- 右列 -->
      <div>
        <div class="card rv" style="padding:22px 26px">
          <div class="kpis">
            <div class="kpi"><div class="v acc" id="kDist">0</div><div class="k">总里程 km</div></div>
            <div class="kpi"><div class="v" id="kGain">0</div><div class="k">累计爬升 m</div></div>
            <div class="kpi"><div class="v" id="kPeak">0</div><div class="k">最高海拔 m</div></div>
            <div class="kpi"><div class="v" id="kDays">0</div><div class="k">行进天数</div></div>
          </div>
        </div>

        <section class="card rv" style="margin-top:26px">
          <div class="sec-h"><div class="eyebrow">路线地图</div><div class="num" id="mapNote">计划 · 实际 · 当前</div></div>
          <div id="map"></div>
          <div class="legend">
            <span><i style="background:var(--route)"></i>计划路线</span>
            <span><i style="background:var(--route-done)"></i>已记录轨迹</span>
            <span><i style="background:var(--accent);border-radius:50%;width:9px;height:9px"></i>当前位置</span>
          </div>
        </section>

        <section class="card rv" style="margin-top:26px">
          <div class="sec-h"><div class="eyebrow">海拔剖面</div><div class="num" id="elevNote"></div></div>
          <svg id="elev" style="width:100%;height:200px;display:block"></svg>
          <div class="chart-x"><span id="elevMin">—</span><span id="elevMax">—</span></div>
        </section>
      </div>
    </div>

    <div class="foot">GHT Atlas · 概念视觉稿 · 真实轨迹数据抽样 · 非最终产品</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="preview-data.js"></script>
  <script>
  (function(){
    const D=window.PREVIEW||{}, css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const $=id=>document.getElementById(id);
    const fmt=n=>Math.round(n).toLocaleString('en-US');

    // ---- fill ----
    $('startLbl').textContent=D.startLabel||'—';
    $('doneDays').textContent=D.doneDays||0;
    $('totalDays').textContent=D.totalDays||0;
    $('kAct').textContent=(D.actuals||[]).length;
    $('kSec').textContent=(D.sections||[]).length;
    $('secCount').textContent=((D.sections||[]).length)+' 段';
    $('kDist').textContent=D.totalKm||0;
    $('kDays').textContent=D.doneDays||0;

    const elev=D.elev||[];
    let gain=0,peak=0;
    for(let i=1;i<elev.length;i++){const d=elev[i]-elev[i-1];if(d>0)gain+=d;if(elev[i]>peak)peak=elev[i];}
    $('kGain').textContent=fmt(gain);
    $('kPeak').textContent=fmt(peak);

    const pct=D.totalDays?Math.round(D.doneDays/D.totalDays*100):0;
    $('pctTxt').textContent=pct+'% 完成';

    // ---- trail rail ----
    requestAnimationFrame(()=>{
      $('railDone').style.width=pct+'%';
      $('railKnob').style.left=pct+'%';
    });
    const ticks=$('ticks');
    (D.sections||[]).forEach((s,i)=>{
      const t=document.createElement('i');t.style.left=((i+1)/(D.sections.length)*100)+'%';ticks.appendChild(t);
    });

    // ---- section list ----
    const list=$('list');
    (D.sections||[]).forEach((s,i)=>{
      const r=document.createElement('div');r.className='row';
      r.innerHTML=`<div class="idx">${String(i+1).padStart(2,'0')}</div>
        <div class="bar"></div>
        <div><div class="nm">${s.name||('路段 '+(i+1))}</div><div class="en">Section ${i+1}</div></div>`;
      list.appendChild(r);
    });

    // ---- elevation chart ----
    (function(){
      const svg=$('elev'); if(!elev.length)return;
      const W=svg.clientWidth||760,H=200,ml=8,mr=8,mt=14,mb=10;
      svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      const min=Math.min(...elev),max=Math.max(...elev),rng=(max-min)||1;
      const px=W-ml-mr, py=H-mt-mb;
      const X=i=>ml+(i/(elev.length-1))*px;
      const Y=v=>mt+(1-(v-min)/rng)*py;
      let line='',area='';
      elev.forEach((e,i)=>{const x=X(i).toFixed(1),y=Y(e).toFixed(1);line+=(i?'L':'M')+x+','+y+' ';});
      area=`M${ml},${mt+py} `+line+`L${ml+px},${mt+py} Z`;
      // gridlines
      let grid='';
      for(let g=0;g<=3;g++){const y=mt+(g/3)*py;grid+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${ml+px}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;}
      const uid='eg'+Date.now();
      const curIdx=Math.floor(elev.length*(D.doneDays/(D.totalDays||1)));
      const cx=X(Math.min(curIdx,elev.length-1)),cy=Y(elev[Math.min(curIdx,elev.length-1)]);
      svg.innerHTML=`
        <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--accent)" stop-opacity=".34"/>
          <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        ${grid}
        <path d="${area}" fill="url(#${uid})"/>
        <path id="elevLine" d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="${cx.toFixed(1)}" y1="${mt}" x2="${cx.toFixed(1)}" y2="${mt+py}" stroke="var(--accent-line)" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="var(--accent)"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="8" fill="none" stroke="var(--accent)" stroke-opacity=".35"/>`;
      // draw animation
      const el=$('elevLine'),len=el.getTotalLength();
      el.style.strokeDasharray=len;el.style.strokeDashoffset=len;
      requestAnimationFrame(()=>{el.style.transition='stroke-dashoffset 1.4s var(--ease)';el.style.strokeDashoffset=0;});
      $('elevMin').textContent='海拔 '+fmt(min)+' m';
      $('elevMax').textContent=fmt(max)+' m';
      $('elevNote').textContent='最低 '+fmt(min)+' · 最高 '+fmt(max)+' m';
    })();

    // ---- map ----
    const route=D.route||[];
    let map;
    function buildMap(theme){
      if(map){map.remove();}
      const lats=route.map(p=>p[0]),lons=route.map(p=>p[1]);
      const cLat=lats.reduce((a,b)=>a+b,0)/lats.length,cLon=lons.reduce((a,b)=>a+b,0)/lons.length;
      map=L.map('map',{zoomControl:true,attributionControl:true}).setView([cLat,cLon],8);
      const v=theme==='light'?'light_nolabels':'dark_nolabels';
      L.tileLayer(`https://{{s}}.basemaps.cartocdn.com/${v}/{z}/{x}/{y}{r}.png`,
        {attribution:'© OpenStreetMap · © CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
      if(route.length){
        const pl=route.map(p=>[p[0],p[1]]);
        L.polyline(pl,{color:css('--route'),weight:2,opacity:1,dashArray:'5 7'}).addTo(map);
        (D.actuals||[]).forEach(tr=>{
          if(!tr.length)return;
          L.polyline(tr,{color:css('--route-done'),weight:5,opacity:.18}).addTo(map); // glow
          L.polyline(tr,{color:css('--route-done'),weight:2.4,opacity:1}).addTo(map);
        });
        const last=(D.actuals||[]).filter(t=>t.length).slice(-1)[0];
        if(last){
          const pos=last[last.length-1];
          L.circleMarker(pos,{radius:5,color:'#fff',weight:2,fillColor:css('--accent'),fillOpacity:1})
            .addTo(map).bindPopup('当前位置');
        }
        map.fitBounds(L.latLngBounds(pl).pad(.12));
      }
    }

    // ---- theme ----
    const btn=$('themeBtn'),txt=$('themeTxt');
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme',t);
      txt.textContent=t==='light'?'深色':'浅色';
      try{localStorage.setItem('ght_theme',t);}catch(e){}
      if(route.length)buildMap(t);
    }
    let cur=(function(){try{return localStorage.getItem('ght_theme')||'dark';}catch(e){return 'dark';}})();
    applyTheme(cur);
    btn.addEventListener('click',()=>{cur=cur==='dark'?'light':'dark';applyTheme(cur);});

    // ---- reveal ----
    const rv=document.querySelectorAll('.rv');
    rv.forEach((el,i)=>setTimeout(()=>el.classList.add('in'),80+i*90));
  })();
  </script>
</body>
</html>
